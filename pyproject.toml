[project]
name = "portal-imoveis"
version = "0.1.0"
description = "Agregador de anuncios de imoveis de portais parceiros"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs>=5.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
